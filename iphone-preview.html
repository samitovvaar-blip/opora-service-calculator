<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предпросмотр на iPhone · ОПОРА</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      background: #e9eef5;
      color: #182a44;
      font: 15px/1.4 system-ui, sans-serif;
    }
    header {
      justify-self: center;
      width: min(100%, 660px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 14px;
    }
    h1 { margin: 0; font-size: 18px; }
    a { color: #234774; text-underline-offset: 3px; }
    .stage { display: grid; place-items: center; min-width: 0; }
    .phone {
      width: 406px;
      padding: 10px 8px 11px;
      zoom: var(--preview-scale, 1);
      border-radius: 48px;
      background: #101722;
      box-shadow: 0 18px 44px rgb(20 31 51 / 24%), inset 0 0 0 1px #475264;
    }
    .status-bar {
      height: 28px;
      display: grid;
      place-items: center;
    }
    .status-bar::after {
      content: "";
      width: 102px;
      height: 18px;
      border-radius: 24px;
      background: #05070b;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 32px;
      background: white;
    }
    .home-bar {
      width: 112px;
      height: 4px;
      margin: 8px auto 0;
      border-radius: 8px;
      background: #d2d8e1;
    }
    :focus-visible { outline: 3px solid #d98d42; outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <h1 id="preview-title">Предпросмотр на iPhone</h1>
    <a id="original-link" target="_blank" rel="noopener">Открыть без рамки ↗</a>
  </header>
  <main class="stage">
    <div class="phone">
      <div class="status-bar" aria-hidden="true"></div>
      <iframe id="preview" title="Мобильный предпросмотр" allow="clipboard-write"></iframe>
      <div class="home-bar" aria-hidden="true"></div>
    </div>
  </main>
  <script>
    const pages = new Map([
      ["app", { name: "Приложение", url: "https://samitovvaar-blip.github.io/OPORA/#/" }],
      ["site", { name: "Сайт", url: "https://oporasamitovva.ru/" }],
      ["calculator", { name: "Калькулятор", url: "./" }]
    ]);
    const heading = document.getElementById("preview-title");
    const original = document.getElementById("original-link");
    const preview = document.getElementById("preview");

    function fitPhone() {
      const availableHeight = window.innerHeight - heading.parentElement.offsetHeight - 34;
      const availableWidth = window.innerWidth - 24;
      const scale = Math.max(0.25, Math.min(1, availableWidth / 406, availableHeight / 905));
      document.documentElement.style.setProperty("--preview-scale", scale);
    }

    function showPage() {
      const page = pages.get(location.hash.slice(1)) ?? pages.get("calculator");
      document.title = page.name + " на iPhone · ОПОРА";
      heading.textContent = page.name + " · iPhone 390 × 844";
      original.href = page.url;
      preview.title = page.name + " ОПОРА";
      preview.src = page.url;
      fitPhone();
    }

    window.addEventListener("resize", fitPhone);
    window.addEventListener("hashchange", showPage);
    showPage();
  </script>
</body>
</html>
